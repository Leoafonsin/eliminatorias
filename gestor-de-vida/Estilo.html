<style>
  :root {
    --fundo: #f5f4fb;
    --cartao: #ffffff;
    --texto: #1f1d2b;
    --suave: #6b6880;
    --borda: #e3e1ef;
    --primaria: #6c4cf5;
    --primaria-texto: #ffffff;
    --alerta: #b5541c;
    --alerta-fundo: #fff2e8;
    --ok: #1f8a4c;
    --perigo: #c0392b;
    --trilho: #ebe9f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #15141c;
      --cartao: #1f1e29;
      --texto: #ecebf5;
      --suave: #a09db5;
      --borda: #33313f;
      --primaria: #8b72ff;
      --alerta: #f0a368;
      --alerta-fundo: #3a2618;
      --ok: #5fd08e;
      --perigo: #ff7b6b;
      --trilho: #2d2b39;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    font-size: 16px;
    line-height: 1.4;
  }
  button { font: inherit; cursor: pointer; }

  .topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--primaria); color: var(--primaria-texto);
  }
  .semestre { display: flex; align-items: center; gap: 8px; }
  .semestre-texto { text-align: center; min-width: 110px; }
  .sem-rotulo { font-weight: 700; font-size: 18px; }
  .sem-id { background: none; border: 0; color: inherit; opacity: .8; font-size: 13px; padding: 0; }
  .icone-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.18); color: inherit; font-size: 22px; line-height: 1;
  }
  .nota-geral { text-align: center; }
  .nota-geral span { display: block; font-size: 26px; font-weight: 800; }
  .nota-geral small { opacity: .8; font-size: 12px; }

  .abas {
    display: flex; position: sticky; top: 0; z-index: 2;
    background: var(--cartao); border-bottom: 1px solid var(--borda);
  }
  .abas button {
    flex: 1; padding: 12px 4px; border: 0; background: none; color: var(--suave);
    border-bottom: 3px solid transparent; font-weight: 600;
  }
  .abas button.ativa { color: var(--primaria); border-bottom-color: var(--primaria); }

  main { padding: 16px; max-width: 760px; margin: 0 auto; }

  .cartao {
    background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px;
    padding: 14px; margin-bottom: 14px;
  }
  .area-topo { display: flex; align-items: center; gap: 10px; }
  .area-icone { font-size: 26px; }
  .area-nome { font-weight: 700; flex: 1; }
  .area-visao { color: var(--suave); font-size: 13px; }
  .area-nota { font-size: 22px; font-weight: 800; }

  .barra { height: 8px; background: var(--trilho); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .barra > div { height: 100%; border-radius: 99px; }
  .barra.fina { height: 5px; margin: 6px 0 0; }

  .pesos { font-size: 13px; margin-bottom: 6px; }
  .pesos.ok { color: var(--ok); }
  .pesos.alerta { color: var(--alerta); background: var(--alerta-fundo); padding: 4px 8px; border-radius: 8px; }

  .metas { list-style: none; margin: 0; padding: 0; }
  .meta {
    display: block; width: 100%; text-align: left; background: none; color: inherit;
    border: 0; border-top: 1px solid var(--borda); padding: 10px 0;
  }
  .meta-linha { display: flex; justify-content: space-between; gap: 10px; }
  .meta-titulo { font-weight: 500; }
  .meta-pontos { font-weight: 700; white-space: nowrap; }
  .meta-info { color: var(--suave); font-size: 13px; }

  .btn-link {
    background: none; border: 0; color: var(--primaria); font-weight: 600; padding: 8px 0 0;
  }
  .primario, .secundario, .perigo, dialog button {
    border-radius: 10px; padding: 10px 14px; border: 1px solid var(--borda);
    background: var(--cartao); color: var(--texto);
  }
  .primario { background: var(--primaria); color: var(--primaria-texto); border-color: var(--primaria); font-weight: 600; }
  .perigo { color: var(--perigo); }
  .vazio { text-align: center; color: var(--suave); padding: 24px 8px; }
  .suave { color: var(--suave); font-weight: 400; }

  dialog {
    width: min(520px, calc(100vw - 24px)); border: 0; border-radius: 16px; padding: 0;
    background: var(--cartao); color: var(--texto);
  }
  dialog::backdrop { background: rgba(10, 8, 25, .55); }
  dialog form { padding: 18px; }
  dialog h2 { margin: 0 0 12px; font-size: 20px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  label small { font-weight: 400; color: var(--suave); }
  input, select, textarea {
    display: block; width: 100%; margin-top: 4px; padding: 10px; font: inherit;
    border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo); color: var(--texto);
  }
  input[type=range] { padding: 0; accent-color: var(--primaria); }
  input[type=color] { height: 44px; padding: 4px; }
  .checkbox { display: flex; align-items: center; gap: 8px; }
  .checkbox input { width: auto; margin: 0; }
  .linha-dupla { display: flex; gap: 10px; align-items: flex-end; }
  .linha-dupla > * { flex: 1; }
  .linha-dupla .curto { flex: 0 0 72px; }
  .peso-dica { font-size: 13px; color: var(--suave); padding-bottom: 14px; }
  .botoes { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .espaco { flex: 1; }
  .historico { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
  .historico li { margin-bottom: 6px; }

  .relatorio h2 { margin: 0 0 4px; }
  .relatorio table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  .relatorio th, .relatorio td { padding: 6px 4px; border-bottom: 1px solid var(--borda); text-align: left; vertical-align: top; }
  .relatorio td.num, .relatorio th.num { text-align: right; white-space: nowrap; }
  .relatorio .comentario { color: var(--suave); font-size: 12px; font-style: italic; }
  .acoes-relatorio { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .texto-relatorio { width: 100%; min-height: 140px; font-family: ui-monospace, monospace; font-size: 13px; }

  .area-lista { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: inherit; text-align: left; padding: 0; }
  .area-lista.inativa { opacity: .5; }
  .etiqueta { font-size: 12px; color: var(--suave); }

  .carregando, .aviso {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 10;
    box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: calc(100vw - 32px);
  }
  .carregando { background: var(--texto); color: var(--fundo); }
  .aviso { background: var(--perigo); color: #fff; }

  @media print {
    .topo, .abas, .acoes-relatorio, .texto-relatorio, #aba-painel, #aba-areas { display: none !important; }
    body { background: #fff; color: #000; }
    .cartao { border: 0; break-inside: avoid; }
  }
</style>
